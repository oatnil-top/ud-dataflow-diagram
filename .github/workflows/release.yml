# Publishes @oatnil/ud-dataflow-diagram to npm from a tag, with NO npm token in this repo.
#
# WHY OIDC AND NOT A SECRET. `gh secret list` on this repo is empty and that is a property
# worth keeping: a long-lived npm credential able to publish the @oatnil scope, sitting in a
# PUBLIC repo, is a much larger blast radius than this package. npm Trusted Publishing mints
# a short-lived token from the `id-token` below instead, so there is nothing here to leak or
# rotate. It is configured per-package at npmjs.com/package/<name>/access.
#
# ⛔ THE FIRST VERSION CANNOT COME FROM HERE. A trusted publisher can only be configured on a
# package that already exists, so 0.1.0 was published by hand from a maintainer's machine and
# that one version has no provenance. Every version from 0.1.1 on is published by this
# workflow and does. See npm/cli#8544 — this is npm's bootstrap gap, not a local mistake.
#
# The tag is the trigger and package.json is the source of truth; the check below fails the
# run when they disagree, because an npm version number is permanent — publishing the wrong
# one cannot be undone, only superseded.
#
# ⛔ NEVER TAG v0.1.0. That version was published by hand before this workflow existed, so
# there is no tag for it and it is tempting to "tidy up" by adding one. Doing so starts this
# workflow, which tries to publish a version the registry already has, and the run dies at
# `npm publish` — after the build, for no reason anyone will remember three days later.
# The first version this workflow publishes is v0.1.1.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write        # required: this is what Trusted Publishing exchanges for a token

jobs:
  publish:
    runs-on: ubuntu-latest     # ⛔ must be a GitHub-hosted runner; OIDC is not offered on self-hosted
    steps:
      - uses: actions/checkout@v4
      # `registry-url` is REQUIRED for OIDC to trigger — dropping it does not help. Measured,
      # both ways, on this repo:
      #   with registry-url    → run 33302251784: E404 on PUT. setup-node writes an .npmrc with
      #                          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}; no token is
      #                          supplied here, so it expands to setup-node's literal
      #                          XXXXX-XXXXX-XXXXX-XXXXX placeholder and npm authenticates with
      #                          junk instead of exchanging the OIDC token. The registry masks
      #                          that rejection as 404, which reads like a bad trusted publisher.
      #   without registry-url → run 33302342229: ENEEDAUTH. No .npmrc at all (NPM_CONFIG_USERCONFIG
      #                          unset), and npm still never attempts the exchange.
      # So: keep registry-url for the `registry=` line, then delete the auth line it also writes.
      # Known upstream: actions/setup-node#1551, npm/documentation#1960.
      - uses: actions/setup-node@v4
        with:
          node-version: 22     # Trusted Publishing needs Node >= 22.14.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: drop the placeholder auth line so npm falls through to OIDC
        run: |
          set -euo pipefail
          rc="${NPM_CONFIG_USERCONFIG:?setup-node did not write an .npmrc}"
          sed -i '/_authToken/d' "$rc"
          # assert the removal, rather than trusting sed to have matched
          if grep -q "_authToken" "$rc"; then echo "::error::_authToken still present in $rc"; exit 1; fi
          echo "auth line removed; registry line still present:"
          grep -c "registry=" "$rc"
      # Node 22 ships npm 10.x; Trusted Publishing landed in 11.5.1.
      - run: npm install -g npm@latest
      - run: npm --version

      - name: tag must equal package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          # Assert both sides are non-empty BEFORE comparing them. A check whose two inputs
          # can both go missing passes vacuously, which is the failure shape this gate exists
          # to prevent: green, and it compared nothing.
          [ -n "$tag" ] || { echo "::error::tag is empty"; exit 1; }
          [ -n "$pkg" ] || { echo "::error::could not read version from package.json"; exit 1; }
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != package.json $pkg"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # dist/ is gitignored, so it does not exist in this checkout. prepublishOnly rebuilds it
      # during `npm publish` too; building here means a broken build fails BEFORE the
      # irreversible step rather than during it.
      - run: npm run build

      - run: npm publish --provenance

      # ⛔ A green publish step is NOT evidence the version is on the registry — and since npm
      # went asynchronous those are genuinely two different things. `npm publish` now ends with
      # "Your package is being processed and may take a few minutes to become available", so
      # acceptance and visibility are separated in time. This step measures VISIBILITY.
      #
      # It distinguishes two outcomes that must never be collapsed into one red:
      #   NOT-YET-VISIBLE  — accepted, still processing. The version number is ALREADY SPENT.
      #   WRONG-CONTENT    — visible, but something does not match.
      # The first is not a failed publish and must not be retried; republishing that version
      # only fails again with "version already exists", which reads like worse breakage.
      - name: prove it actually published
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg_name="$(node -p "require('./package.json').name")"

          # Budget: 10 minutes. npm says "a few minutes"; this is deliberately generous because
          # the cost of waiting is a slow run, and the cost of giving up early is a human
          # concluding the publish failed when it did not.
          deadline=$(( SECONDS + 600 ))
          got=""
          while [ $SECONDS -lt $deadline ]; do
            got="$(npm view "$pkg_name@$tag" version 2>/dev/null || true)"
            [ -n "$got" ] && break
            echo "not visible yet (${SECONDS}s elapsed of 600) — waiting"
            sleep 15
          done

          if [ -z "$got" ]; then
            echo "::error::NOT-YET-VISIBLE: $pkg_name@$tag did not appear on the registry within 600s."
            echo "::error::npm ACCEPTED the publish — this is not a failed publish, and the version number is already spent."
            echo "::error::⛔ Do NOT republish $tag, and do NOT re-run this job — the job would run npm publish again,"
            echo "::error::   which fails with 'version already exists' and looks like worse breakage than the truth."
            echo "::error::   Instead wait, then confirm by hand:  npm view $pkg_name@$tag version dist-tags.latest dist.attestations.url"
            exit 1
          fi

          # From here the package is visible, so anything below is WRONG-CONTENT, a different
          # failure with a different remedy.
          fail_content() { echo "::error::WRONG-CONTENT: $*"; exit 2; }

          [ "$got" = "$tag" ] || fail_content "registry returned version '$got', expected '$tag'"

          latest="$(npm view "$pkg_name" dist-tags.latest 2>/dev/null || true)"
          [ -n "$latest" ] || fail_content "could not read dist-tags.latest"
          [ "$latest" = "$tag" ] || fail_content "dist-tags.latest is '$latest', expected '$tag'"

          # provenance is the reason this workflow exists rather than a laptop; without it the
          # publish silently degraded to an ordinary one.
          att="$(npm view "$pkg_name@$tag" dist.attestations.url 2>/dev/null || true)"
          [ -n "$att" ] || fail_content "no provenance attestation on $pkg_name@$tag"

          # Reported, not gated: a legitimate change to `files` moves this number, so pinning it
          # to a constant would fail honest releases. A human reading the log can still spot a
          # tarball that suddenly halved.
          files="$(npm view "$pkg_name@$tag" dist.fileCount 2>/dev/null || true)"

          echo "verified on registry: $pkg_name@$got (latest=$latest, fileCount=${files:-unknown})"
          echo "provenance: $att"
